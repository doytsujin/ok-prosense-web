<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trace — read your own activity files</title>
<meta name="description" content="Drop a FIT, TCX or GPX file and read it: map, pace, heart rate, elevation, splits. Runs entirely in your browser — nothing is uploaded.">
<!-- Leaflet 1.9.4, vendored rather than pulled from a CDN: the page works
     offline, cannot be changed under us by a third-party host, and makes no
     request that leaks a visit. Map tiles are the only external fetch, and
     they are opt-in. If Leaflet is missing the route panel degrades to a
     message and every chart still renders.
     Loaded BEFORE style.css so our theme rules win — leaflet.css sets its own
     .leaflet-container background, which otherwise overrides the dark theme. -->
<link rel="stylesheet" href="./vendor/leaflet/leaflet.css">
<script src="./vendor/leaflet/leaflet.js" defer></script>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<header class="topbar">
  <h1>Trace</h1>
  <span class="sub">read your own activity files</span>
  <span class="spacer"></span>
  <button class="ghost" id="tiles" type="button" hidden>Map tiles: off</button>
  <button class="ghost" id="theme" type="button">Theme</button>
</header>
<main id="view"></main>
<footer class="foot">
  <span id="privacy">Files are read in this tab. Nothing is uploaded.</span>
  <a href="https://github.com/doytsujin/ok-prosense-web">source</a>
</footer>
<script type="module" src="./app.js"></script>
</body>
</html>
